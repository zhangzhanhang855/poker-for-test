<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>双人斗地主 - 全端适配修复版</title>
  <style>
    :root {
      --bg-color: #1e3d29;
      --card-bg: #ffffff;
      --card-border: #cccccc;
      --accent-color: #f39c12;
      --text-color: #ffffff;
      
      --card-w: clamp(45px, 11vw, 75px);
      --card-h: clamp(65px, 16vw, 110px);
      --font-val: clamp(13px, 3.2vw, 18px);
      --font-suit: clamp(11px, 2.8vw, 16px);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #game-table {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      position: relative;
      background: radial-gradient(circle, #356845 0%, #1a3322 100%);
    }

    /* 顶部区域 */
    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      gap: 8px;
      z-index: 10;
    }

    .ai-config {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ai-config label {
      font-weight: bold;
      color: #f1c40f;
      font-size: clamp(11px, 2.8vw, 14px);
      white-space: nowrap;
    }

    select {
      background: #2c3e50;
      color: #fff;
      border: 1px solid var(--accent-color);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: clamp(11px, 2.8vw, 14px);
      outline: none;
      cursor: pointer;
    }

    .hole-cards-container {
      display: flex;
      gap: 6px;
    }

    /* AI 区域 */
    .ai-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 4px;
      width: 100%;
    }

    .player-info {
      font-weight: bold;
      margin-bottom: 4px;
      background: rgba(0,0,0,0.55);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: clamp(11px, 2.8vw, 14px);
      white-space: nowrap;
    }

    /* 对局中央区域 */
    .play-arena {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      position: relative;
      min-height: 100px;
    }

    .played-cards-box {
      min-height: var(--card-h);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    /* 玩家区域 */
    .player-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    /* 按钮栏（确保层级与显隐） */
    .action-bar {
      display: flex;
      gap: 12px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      width: 100%;
      z-index: 20;
    }

    .btn {
      background: linear-gradient(180deg, #f39c12, #d35400);
      color: #fff;
      border: none;
      padding: 8px 20px;
      font-size: clamp(13px, 3.2vw, 16px);
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      min-height: 40px;
      min-width: 90px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .btn:active:not(:disabled) { transform: scale(0.95); }
    .btn:disabled { background: #7f8c8d !important; cursor: not-allowed; opacity: 0.5; }
    .btn-secondary { background: linear-gradient(180deg, #7f8c8d, #34495e); }

    /* 卡牌样式 */
    .card-list {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: calc(var(--card-h) + 20px);
      box-sizing: border-box;
      padding: 0 10px;
    }

    .card {
      width: var(--card-w);
      height: var(--card-h);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px 5px;
      box-shadow: 1px 2px 5px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.15s ease;
      position: relative;
      flex-shrink: 0;
    }

    .card.selected { 
      transform: translateY(-18px) !important; 
      border: 2px solid #e74c3c; 
    }

    .card.back {
      background: linear-gradient(135deg, #2980b9, #2c3e50);
      border: 1.5px solid #fff;
    }

    .card-val { 
      font-size: var(--font-val); 
      font-weight: bold; 
      line-height: 1; 
    }

    .card-suit { 
      font-size: var(--font-suit); 
      align-self: flex-end; 
    }

    .red { color: #e74c3c; }
    .black { color: #2c3e50; }

    /* 底牌尺寸定义 */
    .hole-cards-container .card {
      width: calc(var(--card-w) * 0.75);
      height: calc(var(--card-h) * 0.75);
      margin-left: 0 !important;
    }

    /* 消息气泡提示 */
    .toast-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.88);
      color: #f1c40f;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: clamp(13px, 3.5vw, 16px);
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 100;
      border: 1px solid #f39c12;
      box-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
      white-space: nowrap;
    }
    .toast-msg.show { opacity: 1; }

    /* 弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      visibility: hidden;
      opacity: 0;
      transition: all 0.25s ease;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-box {
      background: #2c3e50;
      border: 2px solid #f39c12;
      border-radius: 12px;
      padding: 20px 24px;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-title { font-size: clamp(18px, 4.5vw, 22px); color: #f39c12; margin-bottom: 10px; }
    .modal-body { font-size: clamp(13px, 3.5vw, 15px); margin-bottom: 18px; color: #ecf0f1; line-height: 1.4; }

    @media (min-width: 768px) {
      :root {
        --card-w: 70px;
        --card-h: 102px;
        --font-val: 18px;
        --font-suit: 16px;
      }
      .play-arena { min-height: 140px; }
    }
  </style>
</head>
<body>

  <div id="game-table">
    <!-- 顶部控制栏 -->
    <div class="top-section">
      <div class="ai-config">
        <label for="ai-level">AI段位：</label>
        <select id="ai-level" onchange="changeAiLevel(this.value)">
          <option value="1">青铜 (随机)</option>
          <option value="2">白银 (基础)</option>
          <option value="3">黄金 (贪婪)</option>
          <option value="4" selected>王者 (深度策略)</option>
        </select>
      </div>
      <div id="hole-cards" class="hole-cards-container">
        <div class="card back"></div>
        <div class="card back"></div>
        <div class="card back"></div>
      </div>
    </div>

    <!-- AI 区域 -->
    <div class="ai-section">
      <div id="ai-info" class="player-info">AI 对手 (手牌: 17)</div>
      <div id="ai-hand" class="card-list"></div>
    </div>

    <!-- 中央出牌战区 -->
    <div class="play-arena">
      <div id="ai-play-area" class="played-cards-box"></div>
      <div id="player-play-area" class="played-cards-box"></div>
      <div id="toast" class="toast-msg">提示信息</div>
    </div>

    <!-- 玩家区域 -->
    <div class="player-section">
      <div id="action-bar" class="action-bar"></div>
      <div id="player-info" class="player-info">玩家 (农民)</div>
      <div id="player-hand" class="card-list"></div>
    </div>
  </div>

  <!-- 自定义弹窗 -->
  <div id="custom-modal" class="modal-overlay">
    <div class="modal-box">
      <div id="modal-title" class="modal-title">对局结束</div>
      <div id="modal-body" class="modal-body">获胜！</div>
      <button class="btn" onclick="initGame()">再来一局</button>
    </div>
  </div>

<script>
const SUITS = ['♠', '♥', '♣', '♦'];
const VAL_MAP = {
  3: '3', 4: '4', 5: '5', 6: '6', 7: '7', 8: '8', 9: '9', 10: '10',
  11: 'J', 12: 'Q', 13: 'K', 14: 'A', 15: '2', 16: '小王', 17: '大王'
};

const HAND_TYPES = {
  INVALID: 0, SINGLE: 1, PAIR: 2, TRIPLE: 3, TRIPLE_SINGLE: 4, TRIPLE_PAIR: 5,
  STRAIGHT: 6, DOUBLE_STRAIGHT: 7, AIRPLANE: 8, AIRPLANE_WINGS: 9, QUAD_TWO: 10,
  BOMB: 100, ROCKET: 1000
};

let gameState = {
  deck: [], playerHand: [], aiHand: [], holeCards: [],
  currentTurn: 'PLAYER', landlord: null, lastPlay: null,
  selectedCards: [], phase: 'BIDDING', aiLevel: 4,
  playedHistory: []
};

function createDeck() {
  const deck = [];
  let id = 0;
  for (let w = 3; w <= 15; w++) {
    for (let s = 0; s < 4; s++) {
      deck.push({ id: id++, weight: w, suit: SUITS[s], name: VAL_MAP[w] });
    }
  }
  deck.push({ id: id++, weight: 16, suit: '', name: '小王' });
  deck.push({ id: id++, weight: 17, suit: '', name: '大王' });
  return deck;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function initGame() {
  hideModal();
  const deck = createDeck();
  shuffle(deck);

  gameState.holeCards = deck.slice(0, 3);
  gameState.playerHand = deck.slice(3, 20).sort((a,b) => b.weight - a.weight);
  gameState.aiHand = deck.slice(20, 37).sort((a,b) => b.weight - a.weight);
  gameState.lastPlay = null;
  gameState.selectedCards = [];
  gameState.phase = 'BIDDING';
  gameState.landlord = null;
  gameState.playedHistory = [];

  document.getElementById('player-play-area').innerHTML = '';
  document.getElementById('ai-play-area').innerHTML = '';
  
  renderHoleCards(true);
  renderHands();
  setupBiddingUI(); // 开启时显示叫地主按钮栏
  showToast("对局开始，请选择是否叫地主");
}

function changeAiLevel(val) {
  gameState.aiLevel = parseInt(val);
  showToast(`AI 段位切换：${document.getElementById('ai-level').options[gameState.aiLevel-1].text}`);
}

/* 动态计算卡牌间距（确保手机/平板端不超出屏幕） */
function updateDynamicCardSpacing(container, cardCount) {
  if (!container || cardCount <= 0) return;
  const cards = container.querySelectorAll('.card');
  if (cards.length === 0) return;

  const containerWidth = container.clientWidth || (window.innerWidth - 30);
  const cardWidth = cards[0].offsetWidth || 50;

  if (cardCount === 1) {
    cards[0].style.marginLeft = '0px';
    return;
  }

  let calculatedOverlap = (containerWidth - cardWidth) / (cardCount - 1) - cardWidth;
  
  // 限制最大和最小间距
  if (calculatedOverlap > -8) calculatedOverlap = -8;
  if (calculatedOverlap < -cardWidth * 0.75) calculatedOverlap = -cardWidth * 0.75;

  cards.forEach((card, idx) => {
    card.style.marginLeft = idx === 0 ? '0px' : `${calculatedOverlap}px`;
  });
}

/* 牌型分析与比较规则 */
function evalHand(cards) {
  if (!cards || cards.length === 0) return { type: HAND_TYPES.INVALID };
  const sorted = [...cards].sort((a,b) => a.weight - b.weight);
  const len = sorted.length;
  const weights = sorted.map(c => c.weight);

  const counts = {};
  weights.forEach(w => counts[w] = (counts[w] || 0) + 1);
  const unique = Object.keys(counts).map(Number).sort((a,b) => a - b);

  if (len === 2 && weights[0] === 16 && weights[1] === 17) return { type: HAND_TYPES.ROCKET, weight: 17, length: 2 };
  if (len === 4 && unique.length === 1 && counts[unique[0]] === 4) return { type: HAND_TYPES.BOMB, weight: unique[0], length: 4 };
  if (len === 1) return { type: HAND_TYPES.SINGLE, weight: weights[0], length: 1 };
  if (len === 2 && weights[0] === weights[1]) return { type: HAND_TYPES.PAIR, weight: weights[0], length: 2 };
  if (len === 3 && unique.length === 1) return { type: HAND_TYPES.TRIPLE, weight: weights[0], length: 3 };

  if (len === 4 && unique.length === 2) {
    const main = unique.find(w => counts[w] === 3);
    if (main) return { type: HAND_TYPES.TRIPLE_SINGLE, weight: main, length: 4 };
  }
  if (len === 5 && unique.length === 2) {
    const main = unique.find(w => counts[w] === 3);
    const sub = unique.find(w => counts[w] === 2);
    if (main && sub) return { type: HAND_TYPES.TRIPLE_PAIR, weight: main, length: 5 };
  }
  if (len >= 5 && unique.length === len && weights[len-1] <= 14) {
    let ok = true;
    for (let i = 0; i < len - 1; i++) { if (weights[i+1] !== weights[i] + 1) ok = false; }
    if (ok) return { type: HAND_TYPES.STRAIGHT, weight: weights[len-1], length: len };
  }
  if (len >= 6 && len % 2 === 0 && unique.length === len / 2 && weights[len-1] <= 14) {
    let ok = unique.every(w => counts[w] === 2);
    for (let i = 0; i < unique.length - 1; i++) { if (unique[i+1] !== unique[i] + 1) ok = false; }
    if (ok) return { type: HAND_TYPES.DOUBLE_STRAIGHT, weight: unique[unique.length - 1], length: len };
  }
  if (len === 6 && unique.some(w => counts[w] === 4)) {
    return { type: HAND_TYPES.QUAD_TWO, weight: unique.find(w => counts[w] === 4), length: 6 };
  }
  return { type: HAND_TYPES.INVALID };
}

function canBeat(newHand, targetHand) {
  if (!targetHand) return newHand.type !== HAND_TYPES.INVALID;
  if (newHand.type === HAND_TYPES.INVALID) return false;
  if (newHand.type === HAND_TYPES.ROCKET) return true;
  if (newHand.type === HAND_TYPES.BOMB && targetHand.type !== HAND_TYPES.BOMB && targetHand.type !== HAND_TYPES.ROCKET) return true;
  if (newHand.type === targetHand.type && newHand.length === targetHand.length) {
    return newHand.weight > targetHand.weight;
  }
  return false;
}

/* AI 出牌算法 */
function aiTurn() {
  if (gameState.phase !== 'PLAYING' || gameState.currentTurn !== 'AI') return;

  const targetPlay = (gameState.lastPlay && gameState.lastPlay.player !== 'AI') ? gameState.lastPlay.handEval : null;
  let playCards = null;

  switch (gameState.aiLevel) {
    case 1: playCards = aiStrategyLevel1(targetPlay); break;
    case 2: playCards = aiStrategyLevel2(targetPlay); break;
    case 3: playCards = aiStrategyLevel3(targetPlay); break;
    case 4: playCards = aiStrategyLevel4(targetPlay); break;
  }

  if (playCards && playCards.length > 0) {
    executePlay('AI', playCards);
  } else {
    document.getElementById('ai-play-area').innerHTML = '<span style="color:#bdc3c7; font-weight:bold;">不要 (Pass)</span>';
    showToast("AI 选择不出");
    gameState.currentTurn = 'PLAYER';
    setupPlayingUI();
  }
}

function aiStrategyLevel1(target) {
  const cards = gameState.aiHand;
  if (!target) return [cards[cards.length - 1]];
  for (let c of cards) {
    if (canBeat(evalHand([c]), target)) return [c];
  }
  return null;
}

function aiStrategyLevel2(target) {
  const cards = gameState.aiHand;
  if (!target) return [cards[cards.length - 1]];
  for (let i = cards.length - 1; i >= 0; i--) {
    if (canBeat(evalHand([cards[i]]), target)) return [cards[i]];
  }
  for (let i = cards.length - 1; i >= 1; i--) {
    let p = [cards[i], cards[i-1]];
    if (canBeat(evalHand(p), target)) return p;
  }
  return null;
}

function aiStrategyLevel3(target) {
  const cards = gameState.aiHand;
  if (!target) return [cards[0]];
  for (let i = 0; i < cards.length; i++) {
    if (canBeat(evalHand([cards[i]]), target)) return [cards[i]];
  }
  return null;
}

/* 段位 4：王者 (100% 算牌/全图视角/必胜斩杀/精准阻截) */
function aiStrategyLevel4(target) {
  const aiCards = [...gameState.aiHand].sort((a, b) => b.weight - a.weight);

  // 1. PERFECT INFORMATION DEDUCTION (2-Player Speciality)
  // Deduce the human player's exact hand in real-time
  const knownCardIds = new Set([
    ...aiCards.map(c => c.id),
    ...gameState.playedHistory.map(c => c.id)
  ]);
  const fullDeck = createDeck();
  const userCards = fullDeck.filter(c => !knownCardIds.has(c.id)).sort((a, b) => b.weight - a.weight);

  // Helper: Generates all legal combinations from a set of cards
  function getAllValidCombos(cards) {
    const results = [];
    const counts = {};
    cards.forEach(c => counts[c.weight] = (counts[c.weight] || 0) + 1);
    const weights = Object.keys(counts).map(Number).sort((a, b) => a - b);

    // Rocket
    if (cards.some(c => c.weight === 16) && cards.some(c => c.weight === 17)) {
      results.push({ cards: cards.filter(c => c.weight >= 16), eval: { type: HAND_TYPES.ROCKET, weight: 17, length: 2 } });
    }

    // Bombs
    weights.forEach(w => {
      if (counts[w] === 4) {
        results.push({ cards: cards.filter(c => c.weight === w), eval: { type: HAND_TYPES.BOMB, weight: w, length: 4 } });
      }
    });

    // Singles
    weights.forEach(w => {
      results.push({ cards: [cards.find(c => c.weight === w)], eval: { type: HAND_TYPES.SINGLE, weight: w, length: 1 } });
    });

    // Pairs
    weights.forEach(w => {
      if (counts[w] >= 2) {
        results.push({ cards: cards.filter(c => c.weight === w).slice(0, 2), eval: { type: HAND_TYPES.PAIR, weight: w, length: 2 } });
      }
    });

    // Triples (+ Wings)
    weights.forEach(w => {
      if (counts[w] >= 3) {
        const tCards = cards.filter(c => c.weight === w).slice(0, 3);
        results.push({ cards: tCards, eval: { type: HAND_TYPES.TRIPLE, weight: w, length: 3 } });

        weights.forEach(sw => {
          if (sw !== w) {
            const sCard = cards.find(c => c.weight === sw);
            results.push({ cards: [...tCards, sCard], eval: { type: HAND_TYPES.TRIPLE_SINGLE, weight: w, length: 4 } });
          }
        });

        weights.forEach(pw => {
          if (pw !== w && counts[pw] >= 2) {
            const pCards = cards.filter(c => c.weight === pw).slice(0, 2);
            results.push({ cards: [...tCards, ...pCards], eval: { type: HAND_TYPES.TRIPLE_PAIR, weight: w, length: 5 } });
          }
        });
      }
    });

    // Straights (5+)
    const singleWs = weights.filter(w => w <= 14);
    for (let len = 5; len <= singleWs.length; len++) {
      for (let i = 0; i <= singleWs.length - len; i++) {
        let ok = true;
        for (let j = 0; j < len - 1; j++) {
          if (singleWs[i + j + 1] !== singleWs[i + j] + 1) { ok = false; break; }
        }
        if (ok) {
          const strCards = [];
          for (let j = 0; j < len; j++) {
            strCards.push(cards.find(c => c.weight === singleWs[i + j]));
          }
          results.push({ cards: strCards, eval: { type: HAND_TYPES.STRAIGHT, weight: singleWs[i + len - 1], length: len } });
        }
      }
    }

    // Double Straights (3+ Pairs)
    const pairWs = weights.filter(w => counts[w] >= 2 && w <= 14);
    for (let pLen = 3; pLen <= pairWs.length; pLen++) {
      for (let i = 0; i <= pairWs.length - pLen; i++) {
        let ok = true;
        for (let j = 0; j < pLen - 1; j++) {
          if (pairWs[i + j + 1] !== pairWs[i + j] + 1) { ok = false; break; }
        }
        if (ok) {
          const dStrCards = [];
          for (let j = 0; j < pLen; j++) {
            dStrCards.push(...cards.filter(c => c.weight === pairWs[i + j]).slice(0, 2));
          }
          results.push({ cards: dStrCards, eval: { type: HAND_TYPES.DOUBLE_STRAIGHT, weight: pairWs[i + pLen - 1], length: pLen * 2 } });
        }
      }
    }

    return results;
  }

  const aiCombos = getAllValidCombos(aiCards);
  const userCombos = getAllValidCombos(userCards);

  // Helper: Checks if user can beat a given AI combination
  function userCanBeat(comboEval) {
    return userCombos.some(uc => canBeat(uc.eval, comboEval));
  }

  // --- SCENARIO A: AI LEADING (target === null) ---
  if (!target) {
    // 1. Instant Win Check: Can AI finish in 1 move?
    const instantWin = aiCombos.find(c => c.cards.length === aiCards.length);
    if (instantWin) return instantWin.cards;

    // 2. Unblockable Kill Chain: Find a lead combo that user cannot beat,
    // leaving remaining cards that user ALSO cannot beat.
    for (let combo of aiCombos) {
      if (!userCanBeat(combo.eval)) {
        const remainingAiCards = aiCards.filter(c => !combo.cards.some(sc => sc.id === c.id));
        if (remainingAiCards.length === 0) return combo.cards;

        const remainingCombos = getAllValidCombos(remainingAiCards);
        const guaranteedFinish = remainingCombos.find(rc => rc.cards.length === remainingAiCards.length && !userCanBeat(rc.eval));
        if (guaranteedFinish) return combo.cards;
      }
    }

    // 3. Strategic Anti-Player Defense Leading
    const comboStruct = decomposeHand(aiCards);

    // If player has only 1 card left, NEVER lead a single!
    if (userCards.length === 1) {
      if (comboStruct.pairs.length > 0) return comboStruct.pairs[comboStruct.pairs.length - 1];
      if (comboStruct.triples.length > 0) return comboStruct.triples[0];
      if (comboStruct.straights.length > 0) return comboStruct.straights[0];
      return [aiCards[0]]; // Forced to single -> play highest card
    }

    // If player has 2 cards left (likely a pair), prefer leading singles
    if (userCards.length === 2 && comboStruct.singles.length > 0) {
      return [comboStruct.singles[comboStruct.singles.length - 1]];
    }

    // Default: Play longest straight, or smallest pair, or smallest single
    if (comboStruct.straights.length > 0) return comboStruct.straights[0];
    if (comboStruct.pairs.length > 0) return comboStruct.pairs[comboStruct.pairs.length - 1];
    if (comboStruct.singles.length > 0) return [comboStruct.singles[comboStruct.singles.length - 1]];

    return [aiCards[aiCards.length - 1]];
  }

  // --- SCENARIO B: AI FOLLOWING OPPONENT (target !== null) ---
  const beatingCombos = aiCombos.filter(c => canBeat(c.eval, target));
  if (beatingCombos.length === 0) return null; // Cannot beat -> Pass

  // 1. Instant Win Check
  const winningMove = beatingCombos.find(c => c.cards.length === aiCards.length);
  if (winningMove) return winningMove.cards;

  // 2. Emergency Defense Check: User has <= 2 cards or can win on next turn
  const userCanWinNextTurn = userCombos.some(uc => uc.cards.length === userCards.length);
  if (userCards.length <= 2 || userCanWinNextTurn) {
    beatingCombos.sort((a, b) => a.eval.weight - b.eval.weight);
    const nonBombMove = beatingCombos.find(c => c.eval.type !== HAND_TYPES.BOMB && c.eval.type !== HAND_TYPES.ROCKET);
    if (nonBombMove) return nonBombMove.cards;
    return beatingCombos[0].cards; // Use Bomb if required to intercept
  }

  // 3. Normal Economy Following (Save Bombs/Rockets)
  const normalBeatingCombos = beatingCombos.filter(c => c.eval.type !== HAND_TYPES.BOMB && c.eval.type !== HAND_TYPES.ROCKET);
  if (normalBeatingCombos.length > 0) {
    normalBeatingCombos.sort((a, b) => a.eval.weight - b.eval.weight);

    // Tactical Pass: Pass if opponent played a high control card (e.g. 2 or Joker) and beating it wastes AI's top card
    if (target.weight >= 15 && normalBeatingCombos[0].eval.weight === 17) {
      return null;
    }

    return normalBeatingCombos[0].cards;
  }

  // 4. Respond to opponent Bomb only if AI has a follow-up win plan
  if (target.type === HAND_TYPES.BOMB) {
    const bombBeaters = beatingCombos.filter(c => canBeat(c.eval, target));
    if (bombBeaters.length > 0) {
      bombBeaters.sort((a, b) => a.eval.weight - b.eval.weight);
      return bombBeaters[0].cards;
    }
  }

  return null; // Pass by default
}


  if (target.type === HAND_TYPES.SINGLE && target.weight >= 13 && userCardCount > 5 && aiCards.length > 3) {
    if (Math.random() < 0.7) return null;
  }

  if (target.type === HAND_TYPES.PAIR && target.weight >= 11 && userCardCount > 2) {
    if (combo.bombs.length > 0 && Math.random() < 0.6) return null;
  }

  if (target.type === HAND_TYPES.SINGLE) {
    for (let i = combo.singles.length - 1; i >= 0; i--) {
      if (combo.singles[i].weight > target.weight) return [combo.singles[i]];
    }
    for (let i = combo.pairs.length - 1; i >= 0; i--) {
      if (combo.pairs[i][0].weight > target.weight) return [combo.pairs[i][0]];
    }
  } else if (target.type === HAND_TYPES.PAIR) {
    for (let i = combo.pairs.length - 1; i >= 0; i--) {
      if (combo.pairs[i][0].weight > target.weight) return combo.pairs[i];
    }
  }

  if (userCardCount <= 2) {
    for (let c of aiCards) {
      if (canBeat(evalHand([c]), target)) return [c];
    }
    if (combo.bombs.length > 0) return combo.bombs[0];
  }

  return null;
}

function decomposeHand(cards) {
  const counts = {};
  cards.forEach(c => counts[c.weight] = (counts[c.weight] || 0) + 1);
  const combo = { bombs: [], triples: [], pairs: [], singles: [], straights: [] };

  for (let w in counts) {
    if (counts[w] === 4) combo.bombs.push(cards.filter(c => c.weight == w));
    if (counts[w] === 3) combo.triples.push(cards.filter(c => c.weight == w));
    if (counts[w] === 2) combo.pairs.push(cards.filter(c => c.weight == w));
    if (counts[w] === 1) combo.singles.push(cards.find(c => c.weight == w));
  }

  combo.singles.sort((a,b) => b.weight - a.weight);
  combo.pairs.sort((a,b) => b[0].weight - a[0].weight);

  return combo;
}

function executePlay(player, cards) {
  const evalResult = evalHand(cards);
  
  if (player === 'PLAYER') {
    gameState.playerHand = gameState.playerHand.filter(c => !cards.some(sc => sc.id === c.id));
    gameState.selectedCards = [];
    renderPlayedCards('player-play-area', cards);
  } else {
    gameState.aiHand = gameState.aiHand.filter(c => !cards.some(sc => sc.id === c.id));
    renderPlayedCards('ai-play-area', cards);
  }

  gameState.playedHistory.push(...cards);
  gameState.lastPlay = { player, cards, handEval: evalResult };
  
  renderHands();

  if (gameState.playerHand.length === 0) {
    showModal("对局结束", `恭喜您（${gameState.landlord === 'PLAYER' ? '地主' : '农民'}）获得胜利！`);
    return;
  }
  if (gameState.aiHand.length === 0) {
    showModal("对局结束", `AI（${gameState.landlord === 'AI' ? '地主' : '农民'}）击败了您！`);
    return;
  }

  gameState.currentTurn = (player === 'PLAYER') ? 'AI' : 'PLAYER';
  
  if (gameState.currentTurn === 'AI') {
    setupPlayingUI();
    setTimeout(aiTurn, 900);
  } else {
    setupPlayingUI();
  }
}

/* 按钮区域 UI 交互逻辑控制 */
function setupBiddingUI() {
  const actionBar = document.getElementById('action-bar');
  if (!actionBar) return;
  actionBar.innerHTML = `
    <button class="btn" onclick="handleBid(true)">叫地主</button>
    <button class="btn btn-secondary" onclick="handleBid(false)">不叫</button>
  `;
}

function handleBid(isBidding) {
  if (isBidding) {
    gameState.landlord = 'PLAYER';
    gameState.playerHand.push(...gameState.holeCards);
    gameState.playerHand.sort((a,b) => b.weight - a.weight);
    showToast("您成为了地主！");
  } else {
    gameState.landlord = 'AI';
    gameState.aiHand.push(...gameState.holeCards);
    gameState.aiHand.sort((a,b) => b.weight - a.weight);
    showToast("AI 成为了地主！");
  }

  gameState.phase = 'PLAYING';
  gameState.currentTurn = gameState.landlord;
  
  renderHoleCards(false);
  renderHands();
  updateRoleBadges();

  if (gameState.currentTurn === 'AI') {
    setupPlayingUI();
    setTimeout(aiTurn, 900);
  } else {
    setupPlayingUI();
  }
}

function setupPlayingUI() {
  const actionBar = document.getElementById('action-bar');
  if (!actionBar) return;
  
  const isPlayerTurn = gameState.currentTurn === 'PLAYER';
  const canPass = gameState.lastPlay && gameState.lastPlay.player !== 'PLAYER';

  actionBar.innerHTML = `
    <button class="btn" onclick="handlePlayCard()" ${!isPlayerTurn ? 'disabled' : ''}>出牌</button>
    <button class="btn btn-secondary" onclick="handlePass()" ${(!isPlayerTurn || !canPass) ? 'disabled' : ''}>不出</button>
  `;
}

function handlePlayCard() {
  if (gameState.selectedCards.length === 0) {
    showToast("请先选择要出的牌！");
    return;
  }

  const evalResult = evalHand(gameState.selectedCards);
  if (evalResult.type === HAND_TYPES.INVALID) {
    showToast("不符合任何规则牌型！");
    return;
  }

  const target = (gameState.lastPlay && gameState.lastPlay.player !== 'PLAYER') ? gameState.lastPlay.handEval : null;
  if (!canBeat(evalResult, target)) {
    showToast("您出的牌管不上场上的牌！");
    return;
  }

  document.getElementById('player-play-area').innerHTML = '';
  executePlay('PLAYER', gameState.selectedCards);
}

function handlePass() {
  document.getElementById('player-play-area').innerHTML = '<span style="color:#bdc3c7; font-weight:bold;">不要 (Pass)</span>';
  gameState.selectedCards = [];
  renderHands();
  gameState.currentTurn = 'AI';
  showToast("您选择过牌");
  setupPlayingUI();
  setTimeout(aiTurn, 900);
}

function renderCardDOM(card, isBack = false) {
  const el = document.createElement('div');
  el.className = `card ${isBack ? 'back' : ''}`;
  if (!isBack) {
    const isRed = card.suit === '♥' || card.suit === '♦' || card.weight === 17;
    const colorClass = isRed ? 'red' : 'black';
    el.innerHTML = `
      <div class="card-val ${colorClass}">${card.name}</div>
      <div class="card-suit ${colorClass}">${card.suit}</div>
    `;
  }
  return el;
}

function renderHands() {
  const pContainer = document.getElementById('player-hand');
  const aiContainer = document.getElementById('ai-hand');
  if (!pContainer || !aiContainer) return;

  // 1. 玩家手牌渲染
  pContainer.innerHTML = '';
  if (gameState.playerHand && gameState.playerHand.length > 0) {
    gameState.playerHand.forEach(card => {
      const cardEl = renderCardDOM(card);
      if (gameState.selectedCards.some(sc => sc.id === card.id)) cardEl.classList.add('selected');
      cardEl.onclick = () => toggleCardSelect(card);
      pContainer.appendChild(cardEl);
    });
    updateDynamicCardSpacing(pContainer, gameState.playerHand.length);
  }

  // 2. AI 手牌渲染
  aiContainer.innerHTML = '';
  if (gameState.aiHand && gameState.aiHand.length > 0) {
    gameState.aiHand.forEach(() => {
      aiContainer.appendChild(renderCardDOM(null, true));
    });
    updateDynamicCardSpacing(aiContainer, gameState.aiHand.length);
  }

  // 3. UI 牌数信息提示
  const pLen = gameState.playerHand ? gameState.playerHand.length : 0;
  const aiLen = gameState.aiHand ? gameState.aiHand.length : 0;

  document.getElementById('ai-info').innerText = `AI 对手 (${gameState.landlord === 'AI' ? '地主' : '农民'}) - 剩余: ${aiLen}张`;
  document.getElementById('player-info').innerText = `玩家 (${gameState.landlord === 'PLAYER' ? '地主' : '农民'}) - 剩余: ${pLen}张`;
}

function renderHoleCards(hidden = true) {
  const container = document.getElementById('hole-cards');
  if (!container) return;
  container.innerHTML = '';
  gameState.holeCards.forEach(card => container.appendChild(renderCardDOM(card, hidden)));
}

function renderPlayedCards(containerId, cards) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  const cardList = document.createElement('div');
  cardList.className = 'card-list';
  cards.forEach(card => cardList.appendChild(renderCardDOM(card)));
  container.appendChild(cardList);
  updateDynamicCardSpacing(cardList, cards.length);
}

function toggleCardSelect(card) {
  if (gameState.currentTurn !== 'PLAYER') return;
  const idx = gameState.selectedCards.findIndex(sc => sc.id === card.id);
  if (idx > -1) gameState.selectedCards.splice(idx, 1);
  else gameState.selectedCards.push(card);
  renderHands();
}

function updateRoleBadges() {
  document.getElementById('player-info').style.color = gameState.landlord === 'PLAYER' ? '#f39c12' : '#ffffff';
  document.getElementById('ai-info').style.color = gameState.landlord === 'AI' ? '#f39c12' : '#ffffff';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.innerText = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}

function showModal(title, body) {
  document.getElementById('modal-title').innerText = title;
  document.getElementById('modal-body').innerText = body;
  document.getElementById('custom-modal').classList.add('active');
}

function hideModal() {
  document.getElementById('custom-modal').classList.remove('active');
}

window.addEventListener('resize', () => {
  if (gameState.playerHand && gameState.playerHand.length > 0) renderHands();
});

window.onload = initGame;
</script>
