<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3-Player Dou Dizhu (Vs Master AI)</title>
  <style>
    :root {
      --bg-color: #1e3d29;
      --card-bg: #ffffff;
      --card-border: #cccccc;
      --accent-color: #f39c12;
      --text-color: #ffffff;
      
      --card-w: clamp(40px, 9.5vw, 65px);
      --card-h: clamp(58px, 14.2vw, 95px);
      --font-val: clamp(12px, 2.8vw, 16px);
      --font-suit: clamp(10px, 2.4vw, 14px);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #game-table {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      position: relative;
      background: radial-gradient(circle, #356845 0%, #1a3322 100%);
    }

    /* Top Section */
    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 8px;
      gap: 8px;
      z-index: 10;
    }

    .ai-config {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ai-config label {
      font-weight: bold;
      color: #f1c40f;
      font-size: clamp(11px, 2.8vw, 14px);
      white-space: nowrap;
    }

    select {
      background: #2c3e50;
      color: #fff;
      border: 1px solid var(--accent-color);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: clamp(11px, 2.8vw, 14px);
      outline: none;
      cursor: pointer;
    }

    .hole-cards-container {
      display: flex;
      gap: 4px;
    }

    /* 3-Player Middle Arena Layout */
    .middle-arena {
      flex: 1;
      display: grid;
      grid-template-columns: 100px 1fr 100px;
      gap: 6px;
      align-items: center;
      position: relative;
      min-height: 140px;
      margin: 6px 0;
    }

    @media (max-width: 480px) {
      .middle-arena {
        grid-template-columns: 75px 1fr 75px;
      }
    }

    .ai-side-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 6px 4px;
      height: 100%;
    }

    .player-info {
      font-weight: bold;
      background: rgba(0,0,0,0.65);
      padding: 3px 8px;
      border-radius: 10px;
      font-size: clamp(10px, 2.5vw, 13px);
      white-space: nowrap;
      text-align: center;
    }

    .role-badge {
      color: #f39c12;
      font-weight: bold;
    }

    .center-play-area {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      height: 100%;
      position: relative;
    }

    .played-cards-box {
      min-height: calc(var(--card-h) * 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .played-label {
      font-size: 12px;
      color: #bdc3c7;
      font-weight: bold;
    }

    /* Player Bottom Section */
    .player-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    /* Action Buttons Bar */
    .action-bar {
      display: flex;
      gap: 8px;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      width: 100%;
      z-index: 20;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(180deg, #f39c12, #d35400);
      color: #fff;
      border: none;
      padding: 6px 14px;
      font-size: clamp(12px, 3vw, 15px);
      font-weight: bold;
      border-radius: 18px;
      cursor: pointer;
      min-height: 36px;
      min-width: 75px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .btn:active:not(:disabled) { transform: scale(0.95); }
    .btn:disabled { background: #7f8c8d !important; cursor: not-allowed; opacity: 0.4; }
    .btn-secondary { background: linear-gradient(180deg, #7f8c8d, #34495e); }
    .btn-verify { background: linear-gradient(180deg, #e74c3c, #c0392b); }

    /* Card Styling */
    .card-list {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: calc(var(--card-h) + 16px);
      box-sizing: border-box;
      padding: 0 6px;
    }

    .card {
      width: var(--card-w);
      height: var(--card-h);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px 4px;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.15s ease;
      position: relative;
      flex-shrink: 0;
    }

    .card.selected { 
      transform: translateY(-16px) !important; 
      border: 2px solid #e74c3c; 
    }

    .card.back {
      background: linear-gradient(135deg, #2980b9, #2c3e50);
      border: 1.5px solid #fff;
    }

    .card-val { 
      font-size: var(--font-val); 
      font-weight: bold; 
      line-height: 1; 
    }

    .card-suit { 
      font-size: var(--font-suit); 
      align-self: flex-end; 
    }

    .red { color: #e74c3c; }
    .black { color: #2c3e50; }

    .hole-cards-container .card {
      width: calc(var(--card-w) * 0.7);
      height: calc(var(--card-h) * 0.7);
      margin-left: 0 !important;
    }

    /* Toast Notification */
    .toast-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      color: #f1c40f;
      padding: 8px 18px;
      border-radius: 18px;
      font-size: clamp(12px, 3.2vw, 15px);
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 100;
      border: 1px solid #f39c12;
      box-shadow: 0 0 12px rgba(243, 156, 18, 0.5);
      white-space: nowrap;
    }
    .toast-msg.show { opacity: 1; }

    /* Custom Dialog Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      visibility: hidden;
      opacity: 0;
      transition: all 0.25s ease;
    }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-box {
      background: #2c3e50;
      border: 2px solid #f39c12;
      border-radius: 12px;
      padding: 18px 22px;
      text-align: center;
      max-width: 320px;
      width: 85%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .modal-title { font-size: clamp(17px, 4vw, 21px); color: #f39c12; margin-bottom: 8px; }
    .modal-body { font-size: clamp(13px, 3.2vw, 15px); margin-bottom: 16px; color: #ecf0f1; line-height: 1.4; }

    @media (min-width: 768px) {
      :root {
        --card-w: 65px;
        --card-h: 95px;
        --font-val: 17px;
        --font-suit: 15px;
      }
    }
  </style>
</head>
<body>

  <div id="game-table">
    <!-- Top Header -->
    <div class="top-section">
      <div class="ai-config">
        <label for="ai-level">AI 段位：</label>
        <select id="ai-level" onchange="changeAiLevel(this.value)">
          <option value="1">青铜 (随机)</option>
          <option value="2">白银 (基础)</option>
          <option value="3">黄金 (贪婪)</option>
          <option value="4" selected>王者 (强力算牌+夹牌作弊)</option>
        </select>
      </div>
      <div id="hole-cards" class="hole-cards-container">
        <div class="card back"></div>
        <div class="card back"></div>
        <div class="card back"></div>
      </div>
    </div>

    <!-- 3-Player Middle Play Arena -->
    <div class="middle-arena">
      <!-- AI Left -->
      <div class="ai-side-box">
        <div id="ai-left-info" class="player-info">AI 左<br>(手牌: 17)</div>
        <div id="ai-left-hand" class="card-list" style="flex-direction: column; min-height: 80px; margin-top: 4px;"></div>
      </div>

      <!-- Center Played Cards Area -->
      <div class="center-play-area">
        <div id="ai-left-play-area" class="played-cards-box"></div>
        <div id="ai-right-play-area" class="played-cards-box"></div>
        <div id="player-play-area" class="played-cards-box"></div>
        <div id="toast" class="toast-msg">提示信息</div>
      </div>

      <!-- AI Right -->
      <div class="ai-side-box">
        <div id="ai-right-info" class="player-info">AI 右<br>(手牌: 17)</div>
        <div id="ai-right-hand" class="card-list" style="flex-direction: column; min-height: 80px; margin-top: 4px;"></div>
      </div>
    </div>

    <!-- Human Player Area -->
    <div class="player-section">
      <div id="action-bar" class="action-bar"></div>
      <div id="player-info" class="player-info">玩家 (农民)</div>
      <div id="player-hand" class="card-list"></div>
    </div>
  </div>

  <!-- Dialog Modal -->
  <div id="custom-modal" class="modal-overlay">
    <div class="modal-box">
      <div id="modal-title" class="modal-title">对局结束</div>
      <div id="modal-body" class="modal-body">获胜！</div>
      <button class="btn" onclick="initGame()">再来一局</button>
    </div>
  </div>

<script>
const SUITS = ['♠', '♥', '♣', '♦'];
const VAL_MAP = {
  3: '3', 4: '4', 5: '5', 6: '6', 7: '7', 8: '8', 9: '9', 10: '10',
  11: 'J', 12: 'Q', 13: 'K', 14: 'A', 15: '2', 16: '小王', 17: '大王'
};

const HAND_TYPES = {
  INVALID: 0, SINGLE: 1, PAIR: 2, TRIPLE: 3, TRIPLE_SINGLE: 4, TRIPLE_PAIR: 5,
  STRAIGHT: 6, DOUBLE_STRAIGHT: 7, AIRPLANE: 8, QUAD_TWO: 10,
  BOMB: 100, ROCKET: 1000
};

const SEATS = ['PLAYER', 'AI_RIGHT', 'AI_LEFT'];

let gameState = {
  deck: [],
  hands: { PLAYER: [], AI_RIGHT: [], AI_LEFT: [] },
  holeCards: [],
  currentTurnIdx: 0,
  landlord: null,
  lastPlay: null,
  selectedCards: [],
  phase: 'BIDDING', // 'BIDDING' | 'PLAYING'
  aiLevel: 4,
  playedHistory: [],
  bids: {}
};

function createDeck() {
  const deck = [];
  let id = 0;
  for (let w = 3; w <= 15; w++) {
    for (let s = 0; s < 4; s++) {
      deck.push({ id: id++, weight: w, suit: SUITS[s], name: VAL_MAP[w] });
    }
  }
  deck.push({ id: id++, weight: 16, suit: '', name: '小王' });
  deck.push({ id: id++, weight: 17, suit: '', name: '大王' });
  return deck;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function initGame() {
  hideModal();
  const deck = createDeck();
  shuffle(deck);

  gameState.holeCards = deck.slice(0, 3);
  gameState.hands.PLAYER = deck.slice(3, 20).sort((a,b) => b.weight - a.weight);
  gameState.hands.AI_RIGHT = deck.slice(20, 37).sort((a,b) => b.weight - a.weight);
  gameState.hands.AI_LEFT = deck.slice(37, 54).sort((a,b) => b.weight - a.weight);

  gameState.lastPlay = null;
  gameState.selectedCards = [];
  gameState.phase = 'BIDDING';
  gameState.landlord = null;
  gameState.playedHistory = [];
  gameState.bids = {};
  gameState.currentTurnIdx = 0;

  clearPlayAreas();
  renderHoleCards(true);
  renderHands();
  setupBiddingUI();
  showToast("三人对局开始，轮流选择叫地主");
}

function clearPlayAreas() {
  document.getElementById('player-play-area').innerHTML = '';
  document.getElementById('ai-right-play-area').innerHTML = '';
  document.getElementById('ai-left-play-area').innerHTML = '';
}

function changeAiLevel(val) {
  gameState.aiLevel = parseInt(val);
  showToast(`AI 段位切换为：${document.getElementById('ai-level').options[gameState.aiLevel-1].text}`);
}

function updateDynamicCardSpacing(container, cardCount) {
  if (!container || cardCount <= 0) return;
  const cards = container.querySelectorAll('.card');
  if (cards.length === 0) return;

  const containerWidth = container.clientWidth || (window.innerWidth - 30);
  const cardWidth = cards[0].offsetWidth || 45;

  if (cardCount === 1) {
    cards[0].style.marginLeft = '0px';
    return;
  }

  let calculatedOverlap = (containerWidth - cardWidth) / (cardCount - 1) - cardWidth;
  if (calculatedOverlap > -6) calculatedOverlap = -6;
  if (calculatedOverlap < -cardWidth * 0.75) calculatedOverlap = -cardWidth * 0.75;

  cards.forEach((card, idx) => {
    card.style.marginLeft = idx === 0 ? '0px' : `${calculatedOverlap}px`;
  });
}

  function evalHand(cards) {
  if (!cards || cards.length === 0) return { type: HAND_TYPES.INVALID };
  const sorted = [...cards].sort((a,b) => a.weight - b.weight);
  const len = sorted.length;
  const weights = sorted.map(c => c.weight);

  const counts = {};
  weights.forEach(w => counts[w] = (counts[w] || 0) + 1);
  const unique = Object.keys(counts).map(Number).sort((a,b) => a - b);

  if (len === 2 && weights[0] === 16 && weights[1] === 17) return { type: HAND_TYPES.ROCKET, weight: 17, length: 2 };
  if (len === 4 && unique.length === 1 && counts[unique[0]] === 4) return { type: HAND_TYPES.BOMB, weight: unique[0], length: 4 };
  if (len === 1) return { type: HAND_TYPES.SINGLE, weight: weights[0], length: 1 };
  if (len === 2 && weights[0] === weights[1]) return { type: HAND_TYPES.PAIR, weight: weights[0], length: 2 };
  if (len === 3 && unique.length === 1) return { type: HAND_TYPES.TRIPLE, weight: weights[0], length: 3 };

  if (len === 4 && unique.length === 2) {
    const main = unique.find(w => counts[w] === 3);
    if (main) return { type: HAND_TYPES.TRIPLE_SINGLE, weight: main, length: 4 };
  }
  if (len === 5 && unique.length === 2) {
    const main = unique.find(w => counts[w] === 3);
    const sub = unique.find(w => counts[w] === 2);
    if (main && sub) return { type: HAND_TYPES.TRIPLE_PAIR, weight: main, length: 5 };
  }
  if (len >= 5 && unique.length === len && weights[len-1] <= 14) {
    let ok = true;
    for (let i = 0; i < len - 1; i++) { if (weights[i+1] !== weights[i] + 1) ok = false; }
    if (ok) return { type: HAND_TYPES.STRAIGHT, weight: weights[len-1], length: len };
  }
  if (len >= 6 && len % 2 === 0 && unique.length === len / 2 && weights[len-1] <= 14) {
    let ok = unique.every(w => counts[w] === 2);
    for (let i = 0; i < unique.length - 1; i++) { if (unique[i+1] !== unique[i] + 1) ok = false; }
    if (ok) return { type: HAND_TYPES.DOUBLE_STRAIGHT, weight: unique[unique.length - 1], length: len };
  }
  return { type: HAND_TYPES.INVALID };
}

function canBeat(newHand, targetHand) {
  if (!targetHand) return newHand.type !== HAND_TYPES.INVALID;
  if (newHand.type === HAND_TYPES.INVALID) return false;
  if (newHand.type === HAND_TYPES.ROCKET) return true;
  if (newHand.type === HAND_TYPES.BOMB && targetHand.type !== HAND_TYPES.BOMB && targetHand.type !== HAND_TYPES.ROCKET) return true;
  if (newHand.type === targetHand.type && newHand.length === targetHand.length) {
    return newHand.weight > targetHand.weight;
  }
  return false;
}

/* Bidding Logic for 3 Players */
function setupBiddingUI() {
  const currentSeat = SEATS[gameState.currentTurnIdx];
  const actionBar = document.getElementById('action-bar');

  if (currentSeat === 'PLAYER') {
    actionBar.innerHTML = `
      <button class="btn" onclick="handleBid('PLAYER', true)">叫地主</button>
      <button class="btn btn-secondary" onclick="handleBid('PLAYER', false)">不叫</button>
    `;
  } else {
    actionBar.innerHTML = `<span style="color:#f1c40f; font-weight:bold;">等待 ${currentSeat === 'AI_RIGHT' ? 'AI 右' : 'AI 左'} 叫牌...</span>`;
    setTimeout(() => {
      const wantLandlord = Math.random() > 0.4;
      handleBid(currentSeat, wantLandlord);
    }, 800);
  }
}

function handleBid(seat, wantBid) {
  gameState.bids[seat] = wantBid;
  showToast(`${seat === 'PLAYER' ? '您' : (seat === 'AI_RIGHT' ? 'AI 右' : 'AI 左')} ${wantBid ? '叫地主' : '不叫'}`);

  if (Object.keys(gameState.bids).length < 3) {
    gameState.currentTurnIdx = (gameState.currentTurnIdx + 1) % 3;
    setupBiddingUI();
  } else {
    // Determine Landlord
    const bidders = Object.keys(gameState.bids).filter(s => gameState.bids[s]);
    if (bidders.length === 0) {
      gameState.landlord = SEATS[Math.floor(Math.random() * 3)];
    } else {
      gameState.landlord = bidders[bidders.length - 1];
    }

    gameState.hands[gameState.landlord].push(...gameState.holeCards);
    gameState.hands[gameState.landlord].sort((a,b) => b.weight - a.weight);

    gameState.phase = 'PLAYING';
    gameState.currentTurnIdx = SEATS.indexOf(gameState.landlord);
    
    showToast(`${getSeatName(gameState.landlord)} 成为地主！`);
    renderHoleCards(false);
    renderHands();
    updateRoleBadges();
    setupPlayingUI();

    if (SEATS[gameState.currentTurnIdx] !== 'PLAYER') {
      setTimeout(aiTurn, 900);
    }
  }
}

function getSeatName(seat) {
  if (seat === 'PLAYER') return '玩家';
  if (seat === 'AI_RIGHT') return 'AI 右';
  return 'AI 左';
}

function getPlayAreaId(seat) {
  if (seat === 'PLAYER') return 'player-play-area';
  if (seat === 'AI_RIGHT') return 'ai-right-play-area';
  return 'ai-left-play-area';
}

/* Master AI Turn Execution */
function aiTurn() {
  const seat = SEATS[gameState.currentTurnIdx];
  if (gameState.phase !== 'PLAYING' || seat === 'PLAYER') return;

  const targetPlay = (gameState.lastPlay && gameState.lastPlay.player !== seat) ? gameState.lastPlay.handEval : null;
  const targetSeat = gameState.lastPlay ? gameState.lastPlay.player : null;

  let playResult = aiStrategyLevel4(seat, targetPlay, targetSeat);

  if (playResult && playResult.cards && playResult.cards.length > 0) {
    executePlay(seat, playResult.cards, playResult.didCheat, playResult.cheatCard);
  } else {
    document.getElementById(getPlayAreaId(seat)).innerHTML = '<span style="color:#bdc3c7; font-weight:bold;">不要 (Pass)</span>';
    showToast(`${getSeatName(seat)} 选择不出`);
    advanceTurn();
  }
}

/* Level 4 Master AI with Dynamic Cheating Logic ("夹牌") */
function aiStrategyLevel4(seat, target, targetSeat) {
  const hand = [...gameState.hands[seat]].sort((a, b) => b.weight - a.weight);
  const isLandlord = (seat === gameState.landlord);
  const isPartnerPlay = targetSeat && (seat !== gameState.landlord && targetSeat !== gameState.landlord);

  // If partner peasant played a card, avoid over-beating partner
  if (isPartnerPlay && target && target.weight >= 10) {
    return null;
  }

  let cardsToPlay = null;

  if (!target) {
    // Leading turn
    cardsToPlay = [hand[hand.length - 1]];
  } else {
    // Following turn: simple beat
    for (let c of hand) {
      if (canBeat(evalHand([c]), target)) {
        cardsToPlay = [c];
        break;
      }
    }
    if (!cardsToPlay) {
      for (let i = hand.length - 1; i >= 1; i--) {
        let pair = [hand[i], hand[i-1]];
        if (canBeat(evalHand(pair), target)) {
          cardsToPlay = pair;
          break;
        }
      }
    }
  }

  if (!cardsToPlay) return null;

  // --- CHEATING MECHANIC (夹牌) ---
  // Master AI cheats when it has low useless cards (3,4,5) and wants to dump them illegally!
  let didCheat = false;
  let cheatCard = null;

  if (gameState.aiLevel === 4 && hand.length > 3) {
    const uselessCards = hand.filter(c => c.weight <= 5 && !cardsToPlay.some(sc => sc.id === c.id));
    if (uselessCards.length > 0 && Math.random() < 0.45) {
      didCheat = true;
      cheatCard = uselessCards[uselessCards.length - 1]; // Extra card secretly dropped!
    }
  }

  return { cards: cardsToPlay, didCheat, cheatCard };
}

/* Execute Playing Cards */
function executePlay(seat, cards, didCheat = false, cheatCard = null) {
  let cardsToRemove = [...cards];
  if (didCheat && cheatCard) {
    cardsToRemove.push(cheatCard);
  }

  gameState.hands[seat] = gameState.hands[seat].filter(c => !cardsToRemove.some(sc => sc.id === c.id));
  
  const evalResult = evalHand(cards);
  renderPlayedCards(getPlayAreaId(seat), cards);

  gameState.playedHistory.push(...cardsToRemove);
  gameState.lastPlay = { 
    player: seat, 
    cards, 
    handEval: evalResult, 
    didCheat: didCheat,
    cheatedSeat: seat 
  };

  renderHands();

  if (gameState.hands[seat].length === 0) {
    const winnerRole = (seat === gameState.landlord) ? '地主' : '农民';
    showModal("对局结束", `${getSeatName(seat)}（${winnerRole}）率先出完牌获得胜利！`);
    return;
  }

  advanceTurn();
}

function advanceTurn() {
  gameState.currentTurnIdx = (gameState.currentTurnIdx + 1) % 3;
  setupPlayingUI();

  if (SEATS[gameState.currentTurnIdx] !== 'PLAYER') {
    setTimeout(aiTurn, 900);
  }
}

function setupPlayingUI() {
  const actionBar = document.getElementById('action-bar');
  if (!actionBar) return;
  
  const isPlayerTurn = SEATS[gameState.currentTurnIdx] === 'PLAYER';
  const canPass = gameState.lastPlay && gameState.lastPlay.player !== 'PLAYER';
  const canVerify = gameState.lastPlay && gameState.lastPlay.player !== 'PLAYER';

  actionBar.innerHTML = `
    <button class="btn" onclick="handlePlayCard()" ${!isPlayerTurn ? 'disabled' : ''}>出牌</button>
    <button class="btn btn-secondary" onclick="handlePass()" ${(!isPlayerTurn || !canPass) ? 'disabled' : ''}>不出</button>
    <button class="btn btn-verify" onclick="handleVerifyCheat()" ${!canVerify ? 'disabled' : ''}>我要验牌</button>
  `;
}

function handlePlayCard() {
  if (gameState.selectedCards.length === 0) {
    showToast("请先选择要出的牌！");
    return;
  }

  const evalResult = evalHand(gameState.selectedCards);
  if (evalResult.type === HAND_TYPES.INVALID) {
    showToast("不符合任何规则牌型！");
    return;
  }

  const target = (gameState.lastPlay && gameState.lastPlay.player !== 'PLAYER') ? gameState.lastPlay.handEval : null;
  if (!canBeat(evalResult, target)) {
    showToast("您出的牌管不上场上的牌！");
    return;
  }

  document.getElementById('player-play-area').innerHTML = '';
  executePlay('PLAYER', gameState.selectedCards);
  gameState.selectedCards = [];
}

function handlePass() {
  document.getElementById('player-play-area').innerHTML = '<span style="color:#bdc3c7; font-weight:bold;">不要 (Pass)</span>';
  gameState.selectedCards = [];
  renderHands();
  showToast("您选择过牌");
  advanceTurn();
}

/* Verification Feature ("我要验牌") */
function handleVerifyCheat() {
  if (!gameState.lastPlay || gameState.lastPlay.player === 'PLAYER') {
    showToast("只能抓 AI 对手的作弊行为！");
    return;
  }

  const targetSeat = gameState.lastPlay.player;
  const targetSeatName = getSeatName(targetSeat);

  if (gameState.lastPlay.didCheat) {
    showModal("验牌成功！🚨", `抓包成功！${targetSeatName} 在刚才的出牌中偷夹了底牌作弊！被处以取消资格，玩家阵营直接获胜！`);
  } else {
    showModal("验牌失败！❌", `验牌结果：${targetSeatName} 刚才出牌完全合规，并未作弊！您因误报遭受惩罚，直接输掉本局。`);
  }
}

function renderCardDOM(card, isBack = false) {
  const el = document.createElement('div');
  el.className = `card ${isBack ? 'back' : ''}`;
  if (!isBack && card) {
    const isRed = card.suit === '♥' || card.suit === '♦' || card.weight === 17;
    const colorClass = isRed ? 'red' : 'black';
    el.innerHTML = `
      <div class="card-val ${colorClass}">${card.name}</div>
      <div class="card-suit ${colorClass}">${card.suit}</div>
    `;
  }
  return el;
}

function renderHands() {
  const pContainer = document.getElementById('player-hand');
  const aiRightContainer = document.getElementById('ai-right-hand');
  const aiLeftContainer = document.getElementById('ai-left-hand');

  if (!pContainer || !aiRightContainer || !aiLeftContainer) return;

  // Render Human Player
  pContainer.innerHTML = '';
  gameState.hands.PLAYER.forEach(card => {
    const cardEl = renderCardDOM(card);
    if (gameState.selectedCards.some(sc => sc.id === card.id)) cardEl.classList.add('selected');
    cardEl.onclick = () => toggleCardSelect(card);
    pContainer.appendChild(cardEl);
  });
  updateDynamicCardSpacing(pContainer, gameState.hands.PLAYER.length);

  // Render AI Card Backs
  aiRightContainer.innerHTML = '';
  gameState.hands.AI_RIGHT.forEach(() => aiRightContainer.appendChild(renderCardDOM(null, true)));

  aiLeftContainer.innerHTML = '';
  gameState.hands.AI_LEFT.forEach(() => aiLeftContainer.appendChild(renderCardDOM(null, true)));

  // Update Infos
  document.getElementById('player-info').innerHTML = `玩家 (${gameState.landlord === 'PLAYER' ? '<span class="role-badge">地主</span>' : '农民'}) - 剩余: ${gameState.hands.PLAYER.length}张`;
  document.getElementById('ai-right-info').innerHTML = `AI 右 (${gameState.landlord === 'AI_RIGHT' ? '<span class="role-badge">地主</span>' : '农民'})<br>剩余: ${gameState.hands.AI_RIGHT.length}张`;
  document.getElementById('ai-left-info').innerHTML = `AI 左 (${gameState.landlord === 'AI_LEFT' ? '<span class="role-badge">地主</span>' : '农民'})<br>剩余: ${gameState.hands.AI_LEFT.length}张`;
}

function renderHoleCards(hidden = true) {
  const container = document.getElementById('hole-cards');
  if (!container) return;
  container.innerHTML = '';
  gameState.holeCards.forEach(card => container.appendChild(renderCardDOM(card, hidden)));
}

function renderPlayedCards(containerId, cards) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '';
  const cardList = document.createElement('div');
  cardList.className = 'card-list';
  cards.forEach(card => cardList.appendChild(renderCardDOM(card)));
  container.appendChild(cardList);
  updateDynamicCardSpacing(cardList, cards.length);
}

function toggleCardSelect(card) {
  if (SEATS[gameState.currentTurnIdx] !== 'PLAYER') return;
  const idx = gameState.selectedCards.findIndex(sc => sc.id === card.id);
  if (idx > -1) gameState.selectedCards.splice(idx, 1);
  else gameState.selectedCards.push(card);
  renderHands();
}

function updateRoleBadges() {
  document.getElementById('player-info').style.color = gameState.landlord === 'PLAYER' ? '#f39c12' : '#ffffff';
  document.getElementById('ai-right-info').style.color = gameState.landlord === 'AI_RIGHT' ? '#f39c12' : '#ffffff';
  document.getElementById('ai-left-info').style.color = gameState.landlord === 'AI_LEFT' ? '#f39c12' : '#ffffff';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.innerText = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1600);
}
  function showModal(title, body) {
  document.getElementById('modal-title').innerText = title;
  document.getElementById('modal-body').innerText = body;
  document.getElementById('custom-modal').classList.add('active');
}

function hideModal() {
  document.getElementById('custom-modal').classList.remove('active');
}

window.addEventListener('resize', () => {
  if (gameState.hands.PLAYER && gameState.hands.PLAYER.length > 0) renderHands();
});

window.onload = initGame;
</script>
</body>
</html>
